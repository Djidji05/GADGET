server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:3001/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy pour les fichiers uploadés (images produits, bannières, etc.)
    location ^~ /uploads/ {
        proxy_pass http://backend:3001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Explicitement servir robots.txt et sitemap.xml sans fallback SPA
    location = /robots.txt {
        root /usr/share/nginx/html;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        root /usr/share/nginx/html;
        log_not_found off;
        access_log off;
    }

    # Cache Control pour les assets statiques (y compris .txt, .xml, .webp, .svg)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|txt|xml)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

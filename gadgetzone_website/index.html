<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description"
    content="Panyem - Votre marketplace en ligne. Découvrez nos smartphones, ordinateurs, vêtements et accessoires de qualité." />
  <title>Panyem - Votre Marketplace en Ligne</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Panyem" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />



  <!-- Preconnect & DNS prefetch for critical origins (max 3 origins to avoid Lighthouse warning) -->
  <link rel="preconnect" href="https://manage.panyem.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://manage.panyem.com">
  <link rel="dns-prefetch" href="https://images.unsplash.com">

  <!-- Preload Critical LCP Hero Banner Image -->
  <link rel="preload" as="image" href="/images/Flyer_Gadget_Zone_High_Tech.webp" fetchpriority="high">

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>



  <!-- Custom styles for loading page -->
  <style>
    @font-face {
      font-family: 'Font Awesome 6 Free';
      font-display: swap;
    }
    @font-face {
      font-family: 'Font Awesome 6 Brands';
      font-display: swap;
    }
    @font-face {
      font-family: 'Line Awesome';
      font-display: swap;
    }

    /* Basic app styles */
    #app {
      min-height: 100vh;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Static Initial Hero Shell for Instant FCP/LCP (replaced on Vue mount) -->
    <section class="relative px-4 md:px-0">
      <div class="relative w-full aspect-[16/9] md:aspect-[21/9] min-h-[220px] md:min-h-[420px] lg:min-h-[580px] xl:min-h-[620px] bg-gray-900 text-white flex flex-col justify-center items-center px-4 text-center rounded-2xl md:rounded-none overflow-hidden">
        <img src="/images/Flyer_Gadget_Zone_High_Tech.webp" alt="RENAISSANCE" width="1920" height="600" loading="eager" fetchpriority="high" decoding="async" class="absolute inset-0 w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-black/50 via-black/20 to-gray-950/80"></div>
        <div class="max-w-4xl w-full mx-auto px-4 md:px-12 flex flex-col items-center min-h-[140px] md:min-h-[220px] justify-center relative z-10">
          <h1 class="text-2xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold text-white mb-2 md:mb-4 leading-tight drop-shadow-lg" style="font-family: 'Inter', system-ui, sans-serif;">
            RENAISSANCE
          </h1>
          <p class="text-sm sm:text-base md:text-xl lg:text-2xl mb-4 md:mb-8 text-white/95 font-medium max-w-2xl drop-shadow-md">
            Découvrez nos derniers produits technologiques
          </p>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>

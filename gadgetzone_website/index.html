<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description"
    content="Panyem - Votre marketplace en ligne. Découvrez nos smartphones, ordinateurs, vêtements et accessoires de qualité." />
  <title>Panyem - Votre Marketplace en Ligne</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Panyem" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />



  <!-- Preconnect & DNS prefetch for critical origins (max 3 origins to avoid Lighthouse warning) -->
  <link rel="preconnect" href="https://manage.panyem.com">
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://manage.panyem.com">
  <link rel="dns-prefetch" href="https://images.unsplash.com">

  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  </noscript>

  <!-- Deferred FontAwesome Loading -->
  <script>
    window.addEventListener('load', function() {
      var loadFA = function() {
        var l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';
        document.head.appendChild(l);
      };
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadFA, { timeout: 2000 });
      } else {
        setTimeout(loadFA, 1000);
      }
    });
  </script>
  <noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </noscript>

  <!-- Custom styles for loading page -->
  <style>
    @font-face {
      font-family: 'Font Awesome 6 Free';
      font-display: swap;
    }
    @font-face {
      font-family: 'Font Awesome 6 Brands';
      font-display: swap;
    }
    @font-face {
      font-family: 'Line Awesome';
      font-display: swap;
    }

    /* Basic app styles */
    #app {
      min-height: 100vh;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8fafc;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Backend Lint and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gadgetzone
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gadgetzone_admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gadgetzone_admin

      - name: Run Linter
        run: npm run lint
        working-directory: gadgetzone_admin
        continue-on-error: true

      - name: Run Tests
        run: npm test
        working-directory: gadgetzone_admin
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gadgetzone
          DB_USER: postgres
          DB_PASSWORD: postgres_password
          JWT_SECRET: testsecret
          JWT_EXPIRES_IN: 24h
